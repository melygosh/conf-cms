authors:
  - title:
      uk: Загальні положення
      en: General Terms
    body:
      uk: |
        ![Вісник НТУ «ХПІ»](/images/vestnik-hpi.jpg)

        1. Статті, що надходять на розгляд до програмного комітету, повинні повністю відповідати встановленим вимогам до оформлення. В іншому випадку стаття буде повернена на доопрацювання автору або статті буде відмовлено в публікації.
        2. Статті, отримані програмним комітетом, у випадку їх повної відповідності вимогам до оформлення, будуть направлені на подвійне анонімне рецензування.
        3. Авторам статей, що отримали негативну рецензію, у публікації може бути відмовлено. При цьому, програмний комітет залишає за собою право повернути статтю автору на доопрацювання.
        4. Статті, що успішно пройшли процедуру рецензування, будуть опубліковані у *[Віснику НТУ «ХПІ». Серія: Стратегічне управління, управління портфелями програмами та проектами](http://pm.khpi.edu.ua/issue/view/5768)*. Даний науковий журнал входить до переліку фахових видань України, а також включений в наукометричні бази та репозитарії.
        5. На всі статті конференції, які будуть опубліковані у журналі, будуть встановлені цифрові ідентифікатори DOI.
        6. Вісник НТУ «ХПІ» входить до переліку наукових фахових видань категорії Б зі спеціальностей – F3, F4, F6, G7.
        7. Слід звернути увагу, що Вісник видається двічі на рік. Дати публікації Віснику не прив’язані до дат проведення конференції.
      en: |
        ![Bulletin of NTU "KhPI"](/images/vestnik-hpi.jpg)

        1. Papers submitted to the Program committee consideration must fully comply with design requirements. Otherwise, the paper will be returned to the author for refinement or the publication will be refused.
        2. In case of their full compliance with the requirements, papers will be send to a double anonymous review.
        3. If the paper received a negative review its publication may be denied. In this case, the Program committee reserves the right to return the author's paper for revision.
        4. Papers that have successfully passed the review process will be published in the *[Bulletin of NTU "KhPI". Series: Strategic Management, Portfolio, Program and Project Management](http://pm.khpi.edu.ua/issue/view/5768)*. The journal is included in the list of scientific specialised editions of Ukraine; abstracted and indexed in the international scientometric databases, repositories, libraries, search engines, and catalogues.
        5. All conference papers that will be published in the journal will have DOI numerical identifiers.
        6. Please note that the Bulletin is published twice a year. The publication dates of the Bulletin are not tied to the dates of the conference.

