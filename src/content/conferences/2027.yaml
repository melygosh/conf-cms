# серед членів оргкомітету Lobach H.V. (в UA немає), Тимочко — «LNAU». Тут лишено UA-склад до рішення власника.
# Тимочко: ЛНАУ перейменовано на ЛНУП (наказ МОН № 808 від 13.07.2021); EN-абревіатура LNEU — припущення.
committees:
  uk: |
    ### Організаційний комітет

