aim:
  uk: Обговорення нових ідей в галузі стратегічного управління, управління портфелями, програмами, проєктами.
  en: Discussion of new ideas in the field of strategic management, portfolio, program and project management.

sections:
  - name:
      uk: "Інтеграція стратегічного управління, управління портфелями, програмами, проєктами: моделі, методи та технології"
      en: "Integration of Strategic Management with Portfolio, Program and Project Management: Models, Methods, and Techniques"
    items:
      uk:
        - Прогнозне забезпечення стратегічного управління, управління проєктами і програмами.
        - Моделі та методи стратегічного управління, управління портфелями, програмами, проєктами.
        - Маркетингові стратегії в сучасних умовах.
        - Формування портфеля проєктів організації.
        - Оптимізація бізнес-процесів організацій.
        - Інформаційні технології у стратегічному управлінні, управлінні портфелями, програмами, проєктами.
      en:
        - Forecasting in strategic management, project and program management.
        - Models and methods of strategic management, portfolio, program and project management.
        - Contemporary marketing strategies.
        - Portfolio selection and optimization.
        - Balanced scorecard.
        - Business-process modeling and optimization.
        - Information technology in strategic management, portfolio, program and project management.
  - name:
      uk: Управління ІТ проєктами
      en: IT project management
    text:
      uk: Виступ експертів з управління ІТ проєктами.
      en: Speeches by experts in IT project management.
  - name:
      uk: Застосування ефективних технологій управління на практиці
      en: Application of Effective Management Technologies in Practice
    text:
      uk: Виступ експертів-практиків з управління.
      en: |
        Speeches by experts in management.

        Presentations by university graduates who have completed project management training on their professional achievements.

# Робочі мови конференції; мова тез — у publication.rules.
languages:
  uk: Англійська, українська.
  en: English, Ukrainian.

publication:
  summary:
    uk: Матеріали конференції будуть опубліковані у вигляді збірника тез доповідей та у Віснику НТУ «ХПІ».
    en: The conference materials will be published in the form of a collection of abstracts and in the NTU "KhPI" Bulletin.
  rules:
    uk: |
      - Тези приймаються **лише через форму реєстрації**: файл (doc/docx) прикріплюється до форми.
      - Обсяг тез — 2 сторінки тексту формату А4, включно з рисунками, у редакторі MS Word.
      - Мова тез: **англійська**.
      - Назва файлу повинна відповідати прізвищу першого автора.
    en: |
      - Abstracts are accepted **only through the registration form**: attach the file (doc/docx) to the form.
      - Abstracts are 2 pages of A4 text, including figures, in MS Word.
      - Abstract language: **English**.
      - The file name should correspond to the surname of the first author.
  formatting:
    uk: |
      **Тези доповіді оформлюються відповідно до наступних вимог:**

      - шрифт **Times New Roman**, кегль 14; поля: зліва, справа, зверху, знизу – **2 см**; міжрядковий інтервал – **одинарний**;
      - *у першому рядку* – назва доповіді прописними літерами, вирівнювання по центру, жирним шрифтом;
      - *у другому рядку* – по центру ініціали та прізвища авторів доповіді жирним шрифтом;
      - *у третьому рядку* – по центру повна назва організації і місто, курсивом (шрифт напівжирний).
      - Рисунки, що вставляються в текст, повинні мати розміри не більше 12 на 9 см із застосуванням форматів: **bmp**, **tif**, **jpg**. Розмір шрифту під рисунком – 12 pt. Рисунки, виконані за допомогою Word, повинні бути обов'язково згрупованими.
      - Посилання на літературу подаються у стилі **APA**.
    en: |
      **Abstracts should be prepared in accordance with the following requirements:**

      - font **Times New Roman**, size 14; margins: left, right, top, bottom – **2 cm**; line spacing – **single**;
      - *first line* – the title of the report in capital letters, centre alignment, bold;
      - *the second line* – initials and surnames of the authors of the report in bold in the centre;
      - *in the third line* – the full name of the organisation and the city in italics (bold).
      - Figures inserted into the text should be no larger than 12 by 9 cm in size and should use the following formats: **bmp**, **tif**, **jpg**. The font size under the figure is 12 pt. Figures made using Word must be grouped.
      - References to the literature are given in **APA** style.
  articles:
    journalUrl: http://pm.khpi.edu.ua/
    # В англійському листі посилання на шаблон немає.
    templateUrl:
      uk: https://docs.google.com/document/d/1e0Tu9xXuOFtup2iuru7FOt_fjaCLywAY/edit?usp=sharing&ouid=117658175139483443750&rtpof=true&sd=true
    badges:
      uk: [категорія Б, "спеціальності 122, 126", DOI, подвійне анонімне рецензування]
      en: [double-blind peer review, professional edition of Ukraine, 11 international scientometric databases]
    review:
      uk: Статті, отримані програмним комітетом, будуть направлені на подвійне анонімне рецензування. Статті, рекомендовані рецензентами та програмним комітетом, будуть надруковані у Віснику НТУ «ХПІ» ([pm.khpi.edu.ua](http://pm.khpi.edu.ua/)), який входить до переліку наукових фахових видань категорії Б зі спеціальностей – 122, 126. На усі статті, що будуть опубліковані у віснику, буде встановлено цифрові ідентифікатори DOI.
      en: >-
        Papers received by the program committee will be subject to a peer review by the double-blinded reviewers. All accepted papers will be published in scientific journal Bulletin of NTU "KhPI". Series: Strategic Management, Portfolio, Program and Project Management ([pm.khpi.edu.ua](http://pm.khpi.edu.ua/)), which is included in the list of professional editions of Ukraine and is abstracted and indexed in the 11 international scientometric databases, repositories, libraries, search engines, and catalogs.
    requirements:
      uk: Статті можуть бути підготовлені українською або англійською мовами (мова статті обирається особисто автором). Обсяг статті – **не менше 5-ти шаблонних сторінок**. Стаття повинна бути набрана в шаблонному документі та відповідати вимогам, які детально описані на сайті Віснику НТУ «ХПІ», інакше стаття не буде надрукована.
      en: Papers submitted for consideration to the program committee must fully comply with the requirements listed on the scientific journal website. Otherwise, your article will not be published. The terms of payment for publishing a paper are available on the conference website.

