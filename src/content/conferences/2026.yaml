authors:
  - title:
      uk: Загальні положення
      en: General Terms
    body:
      uk: |
        ![Вісник НТУ «ХПІ»](/images/vestnik-hpi.jpg)

        1. Статті, що надходять на розгляд до *[програмного комітету](mailto:publish.conf@gmail.com)*, повинні повністю відповідати встановленим вимогам до оформлення. В іншому випадку стаття буде повернена на доопрацювання автору або статті буде відмовлено в публікації.
        2. Статті, отримані програмним комітетом, у випадку їх повної відповідності вимогам до оформлення, будуть направлені на подвійне анонімне рецензування.
        3. Авторам статей, що отримали негативну рецензію, у публікації може бути відмовлено. При цьому, програмний комітет залишає за собою право повернути статтю автору на доопрацювання.
        4. Стаття, рекомендована рецензентами та програмним комітетом, повинна бути сплачена згідно з розділом *[«Вартість»](#cost)* у відведений термін, який зазначено у розділі *[«Важливі дати»](#dates)*. У випадку несвоєчасної оплати вартості публікації програмний комітет залишає за собою право не публікувати статтю. Сплата за публікацію у цьому випадку буде повернена автору у повному обсязі.
        5. Статті, що успішно пройшли процедуру рецензування та були своєчасно оплачені, будуть опубліковані у *[Віснику НТУ «ХПІ». Серія: Стратегічне управління, управління портфелями програмами та проектами](http://pm.khpi.edu.ua/issue/view/5768)*. Даний науковий журнал входить до переліку фахових видань України, а також включений в наукометричні бази та репозитарії.
        6. На всі статті конференції, які будуть опубліковані у журналі, будуть встановлені цифрові ідентифікатори DOI.
        7. Вісник НТУ «ХПІ» входить до переліку наукових фахових видань категорії Б зі спеціальностей – 122, 126.
      en: |
        ![Bulletin of NTU "KhPI"](/images/vestnik-hpi.jpg)

        1. Papers submitted to the *[Program committee consideration](mailto:publish.conf@gmail.com)*, must fully comply with design requirements. Otherwise, the paper will be returned to the author for refinement or the publication will be refused.
        2. In case of their full compliance with the requirements, papers will be send to a double anonymous review.
        3. If the paper received a negative review its publication may be denied. In this case, the Program committee reserves the right to return the author's paper for revision.
        4. The paper recommended by reviewers and the Program committee should be paid in accordance with section *["Price"](#cost)* in the allotted time, which is defined in Section *["Important Dates"](#dates)*. In case of late publication costs payment, the Program committee reserves the right not to publish the paper. The publication payment in this case will be returned to the author in full.
        5. Papers that have successfully passed the review process and were promptly paid will be published in the *[Bulletin of NTU "KhPI". Series: Strategic Management, Portfolio, Program and Project Management](http://pm.khpi.edu.ua/issue/view/5768)*. The journal is included in the list of scientific specialised editions of Ukraine; abstracted and indexed in the international scientometric databases, repositories, libraries, search engines, and catalogues.
        6. All conference papers that will be published in the journal will have DOI numerical identifiers.
