      text: Після прийняття статті програмним комітетом; копія чека надсилається на [publish.conf@gmail.com](mailto:publish.conf@gmail.com).
  en:
    - title: Registration and abstract
      text: Complete the registration form and attach the abstract file (doc/docx) to it.
    - title: Paper for the Bulletin
      text: Send the electronic version of the paper to [publish.conf@gmail.com](mailto:publish.conf@gmail.com).
    - title: Publication payment
      text: After the paper is accepted by the Program Committee; the terms of payment are available on the conference website.

