# Звернення з інформаційного листа, дослівно.
invitation:
  uk: Запрошуємо Вас прийняти участь у роботі XVI-ї Міжнародної науково-практичної конференції «Інтегроване стратегічне управління, управління портфелями, програмами, проєктами», яка відбудеться 17-19 лютого 2026 року в смт Славсько Львівської області у комбінованому форматі.
  en: We invite you to take part in the 16th International Scientific and Practical Conference “Integrated Strategic Management, Portfolio, Program and Project Management”, which will be held 17-19 February 2026 in hybrid format.

venue:
  # Коротко, для шапки сторінки.
  place:
    uk: Славсько, Українські Карпати
    en: Slavsko, Ukrainian Carpathians
  description:
    uk: |
      Конференція буде проходити в мальовничому куточку Українських Карпат у затишному навчально-оздоровчому таборі Національного університету «Львівська політехніка» [«Політехнік-2»](https://lpnu.ua/politekhnik-2), який знаходиться у селищі Славсько, Львівської області. Славсько це не тільки неповторний місцевий колорит, який закохує в себе багатьох гостей раз і назавжди, а й база гірськолижного відпочинку, де кожному можна підібрати трасу відповідно до свого рівня спортивної підготовки.

      Конференція буде проходити в змішаному форматі. Посилання для приєднання до засідань будуть надіслані зареєстрованим учасникам.
    en: |
      The conference will take place in a picturesque corner of the Ukrainian Carpathians in a cozy educational and health camp of the National University «Lviv Polytechnic» ["Polytechnic-2"](https://lpnu.ua/politekhnik-2), located in Slavsko, Lviv region. Slavsko is not only a unique local flavor that makes many guests fall in love with it once and for all, but also a base for skiing and recreation, where everyone can choose a trail according to their level of athletic training.

      The conference will be held in a hybrid format. Links to join the sessions will be sent to registered participants.
  name:
